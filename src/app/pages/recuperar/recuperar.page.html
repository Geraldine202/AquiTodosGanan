<ion-header class="ion-no-border">
  <ion-toolbar class="toolbar-duoc">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" class="btn-menu-blanco"></ion-back-button>
    </ion-buttons>
    <ion-title style="color: #ffffff; font-size: 1rem;">Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="reset-content">
  <div class="reset-container">
    <div class="reset-card">
      
      <!-- Card explicativa / Header de tarjeta -->
      <div class="reset-header">
        <ion-icon name="key-outline" class="reset-icon"></ion-icon>
        <h2>Recupera tu acceso</h2>
        <p *ngIf="paso === 1">
          Ingresa tu correo institucional registrado para enviarte un código de recuperación.
        </p>
        <p *ngIf="paso === 2">
          Ingresa el código que enviamos a tu correo y tu nueva contraseña.
        </p>
      </div>

      <!-- PASO 1: PEDIR CORREO -->
      <ng-container *ngIf="paso === 1">
        <div class="form-container">
          <ion-item lines="none" class="input-item">
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-input 
              type="email" 
              [(ngModel)]="correo" 
              label="Correo electrónico" 
              label-placement="floating" 
              placeholder="ejemplo@gmail.com">
            </ion-input>
          </ion-item>

          <ion-button 
            expand="block" 
            (click)="solicitarCodigo()"
            class="btn-reset-main">
            Solicitar código
          </ion-button>
        </div>
      </ng-container>

      <!-- PASO 2: INGRESAR TOKEN Y NUEVA CLAVE -->
      <ng-container *ngIf="paso === 2">
        <div class="form-container">
          <ion-item lines="none" class="input-item">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-input 
              type="text" 
              maxlength="6" 
              [(ngModel)]="token" 
              label="Código de 6 dígitos" 
              label-placement="floating" 
              placeholder="123456">
            </ion-input>
          </ion-item>

          <ion-item lines="none" class="input-item">
            <ion-icon name="key-outline" slot="start"></ion-icon>
            <ion-input 
              type="password" 
              [(ngModel)]="nuevaContrasenia" 
              label="Nueva Contraseña" 
              label-placement="floating" 
              placeholder="••••••••">
            </ion-input>
          </ion-item>

          <ion-button 
            expand="block" 
            (click)="cambiarContrasenia()"
            class="btn-reset-main">
            Cambiar Contraseña
          </ion-button>
          
          <ion-button 
            expand="block" 
            fill="clear" 
            (click)="paso = 1"
            class="btn-retry">
            Volver a intentar con otro correo
          </ion-button>
        </div>
      </ng-container>

    </div>
  </div>
</ion-content>
