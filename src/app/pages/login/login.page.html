<app-header></app-header>

<ion-content class="login-content ion-no-padding">
  <div class="login-container">
    <div class="login-card admin-card">

      <!-- Logo Institucional -->
      <div class="logo-box">
        <img src="assets/logo.png" alt="Logo Institucional" class="login-logo" />
      </div>

      <!-- Distintivo Exclusivo de Administración -->
      <div class="ion-text-center ion-margin-bottom">
        <ion-badge color="primary" class="admin-badge">
          <ion-icon name="shield-checkmark-outline"></ion-icon> Acceso Administrativo
        </ion-badge>
      </div>

      <!-- Encabezado de la Tarjeta -->
      <div class="login-header">
        <h1>Portal de Administración</h1>
        <p>Inicia sesión con tu cuenta de Administrador</p>
      </div>

      <!-- Formulario de Entrada -->
      <div class="form-container">
        
        <!-- Campo Correo -->
        <ion-item class="input-item" lines="none">
          <ion-icon name="mail-unread-outline" slot="start" color="primary"></ion-icon>
          <ion-input 
            type="email" 
            placeholder="correo@gmail.com" 
            label="Correo Institucional" 
            labelPlacement="floating" 
            [(ngModel)]="credenciales.correo">
          </ion-input>
        </ion-item>

        <!-- Campo Contraseña con Ojito -->
        <ion-item class="input-item" lines="none">
          <ion-icon name="lock-closed-outline" slot="start" color="primary"></ion-icon>
          <ion-input 
            [type]="mostrarPassword ? 'text' : 'password'" 
            placeholder="••••••••" 
            label="Contraseña" 
            labelPlacement="floating" 
            [(ngModel)]="credenciales.password">
          </ion-input>
          <ion-icon 
            [name]="mostrarPassword ? 'eye-off-outline' : 'eye-outline'" 
            slot="end" 
            class="icon-ojo"
            (click)="toggleMostrarPassword()">
          </ion-icon>
        </ion-item>

        <!-- Botón Principal de Ingreso -->
        <ion-button expand="block" color="primary" class="btn-login-main" (click)="iniciarSesion()">
          <ion-icon slot="start" name="log-in-outline"></ion-icon>
          Ingresar al Panel
        </ion-button>

        <!-- Enlace de Recuperación -->
        <div class="login-footer-links">
          <ion-button fill="clear" routerLink="/recuperar" class="btn-forgot">
            ¿Olvidaste tu contraseña administrativa?
          </ion-button>
        </div>

      </div>

    </div>
  </div>
  <app-footer></app-footer>
</ion-content>
