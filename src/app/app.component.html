<ion-app>

  <!-- MENÚ LATERAL GLOBAL -->
  <ion-menu contentId="main-content" side="start" type="overlay" persistent="true">
    
    <!-- ENCABEZADO DEL MENÚ -->
    <ion-header class="ion-no-border">
      <ion-toolbar class="menu-toolbar">
        <div class="brand-container">
          <img src="assets/logo.png" alt="Logo Aquí Todos Ganan" class="brand-logo" />
        </div>
      </ion-toolbar>
    </ion-header>

    <!-- CUERPO DEL MENÚ -->
    <ion-content class="menu-content">
      <div class="menu-body">
        
        <!-- SECCIÓN 1: PRINCIPAL -->
        <p class="menu-section-title">General</p>

        <ion-list lines="none" class="menu-list">
          <!-- Inicio -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/home" 
            routerLinkActive="menu-item-activo" 
            [routerLinkActiveOptions]="{ exact: true }"
            class="menu-item-custom">
            <ion-icon name="home-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Inicio</ion-label>
          </ion-item>

          <!-- Perfil -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/perfil" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="person-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Mi Perfil</ion-label>
          </ion-item>
        </ion-list>

        <!-- SECCIÓN 2: GESTIÓN DE USUARIOS -->
        <p class="menu-section-title">Gestión de Usuarios</p>

        <ion-list lines="none" class="menu-list">
          <!-- Agregar Docente -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/docentes" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="person-add-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Agregar Docente</ion-label>
          </ion-item>

          <!-- Administrar Alumnos -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/admin-alumnos" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="people-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Administrar Alumnos</ion-label>
          </ion-item>
        </ion-list>

        <!-- SECCIÓN 3: MÓDULOS ADMINISTRATIVOS -->
        <p class="menu-section-title">Administración y Reportes</p>

        <ion-list lines="none" class="menu-list">
          <!-- Administrar Actividades -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/admin-actividades" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="calendar-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Administrar Actividades</ion-label>
          </ion-item>

          <!-- Administrar Premios -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/admin-premios" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="trophy-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Administrar Premios</ion-label>
          </ion-item>

          <!-- Solicitudes Canjes -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/admin-canjes" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="swap-horizontal-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Solicitudes Canjes</ion-label>
          </ion-item>

          <!-- Generar reporte -->
          <ion-item 
            button
            (click)="cerrarMenu()" 
            routerLink="/reportes" 
            routerLinkActive="menu-item-activo"
            class="menu-item-custom">
            <ion-icon name="document-text-outline" slot="start" class="menu-icon"></ion-icon>
            <ion-label class="menu-label notranslate" translate="no">Generar Reportes</ion-label>
          </ion-item>
        </ion-list>

      </div>
    </ion-content>

    <!-- PIE DEL MENÚ -->
    <ion-footer class="ion-no-border menu-footer">
      <div class="footer-content">
        <span class="notranslate" translate="no">Aquí Todos Ganan</span>
        <span class="badge-version">v1.0.0</span>
      </div>
    </ion-footer>

  </ion-menu>

  <!-- RUTAS DE NAVEGACIÓN -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
